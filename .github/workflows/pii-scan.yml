name: Personal details scan
# Reads every file after a push to main or a pull request (.github/scripts/pii-scan.ts) and fails on a personal detail or a
# secret, so a change made on github.com is checked as well. Logs show the rule and the place only, never the text.
# In the private repo only the files that get published are read. No install step and no secrets: the script uses only Node itself.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --experimental-strip-types .github/scripts/pii-scan.ts
